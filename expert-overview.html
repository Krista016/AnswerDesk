<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; background: #222; color: #fff; padding: 10px; }
    .card { background: #333; padding: 5px; text-align: center; border-radius: 6px; }
    img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
    p { margin: 5px 0 0; font-size: 11px; }
  </style>
</head>
<body>
  <script>
    for (let i = 5; i <= 35; i++) {
      document.write(`<div class="card"><img src="assets/expert-${i}.png"><p>expert-${i}</p></div>`);
    }
  </script>
</body>
</html>
